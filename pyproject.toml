[project]
name = "microrag"
version = "0.2.4"
description = "A feature-rich, universal RAG library for Python with ONNX-backed embeddings and DuckDB storage"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pavel Liashkov", email = "pavel.liashkov@protonamil.com" }]
keywords = ["rag", "embeddings", "vector-search", "duckdb", "onnx", "nlp", "bm25", "duckdb", "fts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "duckdb>=0.9.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.20.0",
    "pyarrow>=23.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pyclean>=3.1.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
sentence-transformers = [
    "sentence-transformers>=2.2.0",
    "onnxruntime>=1.17.0",
]
fastembed = [
    "fastembed>=0.2.0",
]
all = [
    "microrag[sentence-transformers]",
    "microrag[fastembed]",
]
cpu = [
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" }
]
torchvision = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" }
]
torchaudio = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25",
    "rank_bm25.*",
    "duckdb",
    "duckdb.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "fastembed",
    "fastembed.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
